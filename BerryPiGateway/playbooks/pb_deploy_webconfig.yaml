- name: Deploy the BerryMetre web configuration interface and the BerryCells WiFi access point
  hosts: berrygateway
  vars:
    wifi_ssid: BerryCells
    wifi_password: BerrySolarCells
    wifi_country: GB  # ISO 3166-1 code for the United Kingdom (there is no separate code for England)
    wifi_channel: 6
    wifi_address: 192.168.15.2/24
  tasks:
    - name: Install hostapd for the WiFi access point and iw for raspi-config
      become: true
      apt:
        pkg:
          - hostapd
          - iw
        state: present

    - name: Read the current WiFi country
      become: true
      command: raspi-config nonint get_wifi_country
      register: wifi_country_current
      changed_when: false
      check_mode: false
      failed_when: false

    - name: Set the WiFi country (the access point does not start without it)
      become: true
      command: raspi-config nonint do_wifi_country {{ wifi_country }}
      when: wifi_country_current.stdout != wifi_country

    - name: Read the WiFi radio state
      command: nmcli radio wifi
      register: wifi_radio
      changed_when: false
      check_mode: false

    - name: Enable wifi
      become: true
      command: nmcli radio wifi on
      when: wifi_radio.stdout != "enabled"

    # NetworkManager configures access points with WPA-PSK and WPA-PSK-SHA256, but the
    # Pi 3 firmware only advertises WPA-PSK in its beacons. Clients then abort the
    # handshake (reason 17, IE_DIFFERENT), which shows up as "incorrect password".
    # hostapd advertises WPA-PSK only, so wlan0 is taken away from NetworkManager.
    - name: Remove the old NetworkManager access point connections
      become: true
      community.general.nmcli:
        conn_name: "{{ item }}"
        state: absent
      loop:
        - Hotspot
        - BerryCells

    - name: Let NetworkManager ignore wlan0
      become: true
      copy:
        dest: /etc/NetworkManager/conf.d/berrycells-unmanaged-wlan0.conf
        content: |
          [keyfile]
          unmanaged-devices=interface-name:wlan0
      register: nm_conf

    - name: Reload NetworkManager configuration
      become: true
      ansible.builtin.systemd_service:
        name: NetworkManager
        state: reloaded
      when: nm_conf is changed

    - name: Configure the address and DHCP server of wlan0 with systemd-networkd
      become: true
      copy:
        dest: /etc/systemd/network/10-berrycells-wlan0.network
        content: |
          [Match]
          Name=wlan0

          [Network]
          Address={{ wifi_address }}
          DHCPServer=yes
          ConfigureWithoutCarrier=yes

          [DHCPServer]
          PoolOffset=10
          PoolSize=100
      register: networkd_conf

    - name: Enable systemd-networkd
      become: true
      ansible.builtin.systemd_service:
        name: systemd-networkd
        enabled: true
        state: started

    - name: Disable systemd-networkd-wait-online (enabled with systemd-networkd, would delay booting)
      become: true
      ansible.builtin.systemd_service:
        name: systemd-networkd-wait-online
        enabled: false

    - name: Apply the wlan0 network configuration
      become: true
      ansible.builtin.systemd_service:
        name: systemd-networkd
        state: restarted
      when: networkd_conf is changed

    - name: Configure the static WiFi access point
      become: true
      copy:
        dest: /etc/hostapd/hostapd.conf
        mode: "0600"
        content: |
          interface=wlan0
          driver=nl80211
          ssid={{ wifi_ssid }}
          country_code={{ wifi_country }}
          hw_mode=g
          channel={{ wifi_channel }}
          ieee80211n=1
          wmm_enabled=1
          auth_algs=1
          wpa=2
          wpa_key_mgmt=WPA-PSK
          rsn_pairwise=CCMP
          wpa_passphrase={{ wifi_password }}
      register: hostapd_conf

    - name: Enable and start hostapd
      become: true
      ansible.builtin.systemd_service:
        name: hostapd
        masked: false
        enabled: true
        state: started
      ignore_errors: "{{ ansible_check_mode }}"  # hostapd is not installed in a dry run

    - name: Restart hostapd after a configuration change
      become: true
      ansible.builtin.systemd_service:
        name: hostapd
        state: restarted
      when: hostapd_conf is changed or nm_conf is changed
      ignore_errors: "{{ ansible_check_mode }}"

    - name: Ensure web interface directory exists
      file:
        path: ~/berrywebconfig
        state: directory

    - name: Copy web interface
      copy:
        dest: ~/berrywebconfig/berrywebconfig.py
        src: ../../BerryMetrePythonReceiver/webconfig/berrywebconfig.py
        mode: "0755"
      register: webconfig_code

    - name: Install web interface service
      become: true
      copy:
        dest: /etc/systemd/system/berrywebconfig.service
        src: ../overlay/etc/systemd/system/berrywebconfig.service
      register: webconfig_service

    - name: Enable and start web interface service
      become: true
      ansible.builtin.systemd_service:
        name: berrywebconfig
        enabled: true
        state: started
        daemon_reload: "{{ webconfig_service is changed }}"
      ignore_errors: "{{ ansible_check_mode }}"  # the unit file is not installed in a dry run

    - name: Restart web interface service after an update
      become: true
      ansible.builtin.systemd_service:
        name: berrywebconfig
        state: restarted
      when: webconfig_code is changed or webconfig_service is changed
      ignore_errors: "{{ ansible_check_mode }}"
